<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243b6b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Schedule Hub"><link rel="manifest" href="manifest.webmanifest">
<title>My Schedule Hub Cloud</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
header{background:#243b6b;color:#fff;padding:18px 24px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px}.sub{opacity:.8;font-size:12px;margin-top:3px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;background:#e8edf7;color:#243b6b}nav button.active{background:#fff}
main{max-width:1100px;margin:22px auto;padding:0 16px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #1b2b4a12}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:10px;border:1px solid #d6ddeb;border-radius:9px;margin-top:5px;font:inherit}textarea{min-height:80px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.primary{background:#243b6b;color:white}.danger{background:#ffe7e7;color:#a51f1f}
.card{border:1px solid #e1e6f0;border-radius:12px;padding:12px;margin-top:9px}.muted{color:#697386;font-size:13px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf2ff;color:#36579a;font-size:12px;margin-left:5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:150px;border:1px solid #e0e5ef;border-radius:10px;padding:9px}.day h3{font-size:13px;margin:0 0 8px}.event{background:#eef4ff;border-radius:8px;padding:7px;margin:5px 0;font-size:12px}.income{color:#087443}.expense{color:#a33a1c}
.hidden{display:none}.notice{padding:10px;border-radius:10px;background:#fff6d9;margin-bottom:12px}
.auth{max-width:520px;margin:30px auto}.status{padding:10px;border-radius:10px;background:#edf2ff;margin-bottom:12px}
@media(max-width:700px){
      header{padding:12px 12px;position:sticky;top:0}
      h1{font-size:19px}
      nav{gap:6px;margin-top:10px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px;-webkit-overflow-scrolling:touch}
      nav button{flex:0 0 auto;padding:9px 11px;font-size:13px}
      main{margin:12px auto;padding:0 10px}
      .panel{border-radius:13px;padding:13px;margin-bottom:12px}
      .grid{grid-template-columns:1fr;gap:10px}
      input,textarea,select{font-size:16px;min-height:44px}
      button,.btn{min-height:44px}
      .actions{gap:7px}
      .actions button{flex:1 1 auto}
      .week{grid-template-columns:1fr}
      .day{min-height:auto}
      .card{padding:11px}
    }
</style>
</head>
<body>
<div id="authView" class="auth">
<div class="panel">
<h1>📅 My Schedule Hub Cloud</h1>
<p class="muted">PC・スマホで予定を共有できます。</p>
<div class="grid">
<label>メールアドレス<input id="email" type="email" autocomplete="email" required></label>
<label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
</div>
<div class="actions">
<button class="primary" id="loginBtn">ログイン</button>
<button id="signupBtn">新規登録</button>
</div>
<div id="authMsg" class="muted" style="margin-top:12px"></div>
</div>
</div>

<div id="appView" class="hidden">
<header>
<h1>📅 My Schedule Hub</h1><div class="sub">予定・課題・給料・出費をまとめて管理　｜　クラウド版</div>
<nav>
<button class="tab active" data-tab="home">ホーム</button><button class="tab" data-tab="schedule">予定登録</button>
<button class="tab" data-tab="tasks">課題</button><button class="tab" data-tab="search">検索</button>
<button class="tab" data-tab="week">週間予定</button><button id="syncBtn">☁️ 同期</button><button id="logoutBtn">ログアウト</button>
</nav>
</header>
<main>
<section id="home" class="tabpage"><div class="panel"><h2>今週の予定</h2><div id="homeWeek"></div></div><div class="panel"><h2>課題</h2><div id="homeTasks"></div></div></section>
<section id="schedule" class="tabpage hidden"><div class="panel"><h2>予定を登録</h2>
<form id="eventForm"><div class="grid">
<label>日付<input id="date" type="date" required></label><label>開始時間<input id="start" type="time"></label><label>終了時間<input id="end" type="time"></label>
<label>内容<select id="preset"><option value="">-- 登録済みから選択 --</option></select><input id="title" placeholder="例：授業、あそび、バイト"></label>
<label>その日の給料<input id="income" type="number" min="0" step="1" placeholder="円"></label><label>出費<input id="expense" type="number" min="0" step="1" placeholder="円"></label>
<label>繰り返し<select id="repeat"><option value="none">なし</option><option value="weekly">毎週（4週間）</option><option value="monthly">毎月（3回）</option></select></label>
</div><div class="actions"><button class="primary" type="submit">予定を登録</button><button type="button" id="clearForm">入力をクリア</button></div></form></div>
<div class="panel"><h2>よく使う予定</h2><div id="presets"></div></div></section>
<section id="tasks" class="tabpage hidden"><div class="panel"><h2>課題を登録</h2><form id="taskForm"><div class="grid">
<label>課題内容<textarea id="taskTitle" required placeholder="例：民法レポート"></textarea></label><label>提出期限<input id="due" type="date" required></label><label>必要日数<input id="days" type="number" min="1" value="3"></label>
</div><div class="actions"><button class="primary">課題を登録</button></div></form></div><div class="panel"><h2>登録済み課題</h2><div id="tasksList"></div></div></section>
<section id="search" class="tabpage hidden"><div class="panel"><h2>予定を検索</h2><div class="grid">
<label>日付<input id="qDate" type="date"></label><label>時間<input id="qTime" type="time"></label><label>内容<input id="qText" placeholder="例：塾"></label>
</div><div class="actions"><button class="primary" id="doSearch">検索</button><button id="allSearch">すべて表示</button></div><div id="results"></div></div></section>
<section id="week" class="tabpage hidden"><div class="panel"><h2>週間予定表</h2><div class="grid"><label>週の開始日<input id="weekStart" type="date"></label></div><div id="weekCalendar" style="margin-top:14px"></div><div id="textWeek" style="margin-top:14px"></div></div></section>
</main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Supabase設定：このクラウド版では接続先を設定済みです。 */
const SUPABASE_URL='https://faaqypkbqsatdpgixofv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_Un4FLZ1wXwRtzuYxKrCwXQ_UwYXNejX';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let db={events:[],tasks:[],presets:[]};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n?Number(n).toLocaleString()+'円':'-';
function iso(d){return d.toISOString().slice(0,10)}
function addDays(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function fmt(s){let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()}`}
function time(e){return e.start&&e.end?`${e.start}-${e.end}`:e.start?`${e.start}〜`:e.end?`〜${e.end}`:'時間未定'}

async function loadData(){
 const {data:userData}=await supabaseClient.auth.getUser();
 if(!userData.user)return;
 const uid=userData.user.id;
 const [{data:events,error:e1},{data:tasks,error:e2},{data:presets,error:e3}]=await Promise.all([
   supabaseClient.from('schedules').select('*').eq('user_id',uid).order('date').order('start_time'),
   supabaseClient.from('tasks').select('*').eq('user_id',uid).order('due_date'),
   supabaseClient.from('presets').select('*').eq('user_id',uid).order('title')
 ]);
 if(e1||e2||e3){console.error(e1||e2||e3);throw new Error('データを読み込めませんでした。SupabaseのテーブルとRLS設定を確認してください。')}
 db.events=(events||[]).map(e=>({id:e.id,date:e.date,start:e.start_time||'',end:e.end_time||'',title:e.title,income:e.salary||0,expense:e.expense||0}));
 db.tasks=(tasks||[]).map(t=>({id:t.id,title:t.title,due:t.due_date,start:addDays(t.due_date,-(Math.max(1,Number(t.days_needed)||1))+1)}));
 db.presets=(presets||[]).map(p=>p.title);
 renderPresets();renderHome();renderTasks();renderWeek();
}

async function addEvent(ev){
 const {data:userData}=await supabaseClient.auth.getUser(); const uid=userData.user.id;
 const {data,error}=await supabaseClient.from('schedules').insert({
   user_id:uid,date:ev.date,start_time:ev.start||null,end_time:ev.end||null,title:ev.title,salary:ev.income||0,expense:ev.expense||0
 }).select().single();
 if(error)throw error; return data;
}
async function addPreset(name){
 const {data:userData}=await supabaseClient.auth.getUser(); const uid=userData.user.id;
 const {error}=await supabaseClient.from('presets').insert({user_id:uid,title:name});
 if(error && error.code!=='23505')throw error;
}
async function deleteEvent(id){const {error}=await supabaseClient.from('schedules').delete().eq('id',id);if(error)throw error;db.events=db.events.filter(e=>e.id!==id);renderHome();renderWeek()}
async function deletePreset(name){const {data:userData}=await supabaseClient.auth.getUser();const uid=userData.user.id;const {error}=await supabaseClient.from('presets').delete().eq('user_id',uid).eq('title',name);if(error)throw error;db.presets=db.presets.filter(x=>x!==name);renderPresets()}
async function addTask(t){
 const {data:userData}=await supabaseClient.auth.getUser(); const uid=userData.user.id;
 const {data,error}=await supabaseClient.from('tasks').insert({user_id:uid,title:t.title,due_date:t.due,days_needed:Math.max(1,Math.round((new Date(t.due+'T12:00:00')-new Date(t.start+'T12:00:00'))/86400000)+1)}).select().single();
 if(error)throw error;return data;
}
async function addTaskEvent(ev){return addEvent(ev)}
async function deleteTask(id){const {error}=await supabaseClient.from('tasks').delete().eq('id',id);if(error)throw error;db.tasks=db.tasks.filter(t=>t.id!==id);renderTasks();renderHome()}

function renderPresets(){
 $('preset').innerHTML='<option value="">-- 登録済みから選択 --</option>'+db.presets.map((p,i)=>`<option value="${i}">${esc(p)}</option>`).join('');
 $('presets').innerHTML=db.presets.length?db.presets.map(p=>`<span class="pill">${esc(p)} <button onclick="delPreset(${JSON.stringify(p).replace(/</g,'\\u003c')})">×</button></span>`).join(''):'まだありません。予定を登録すると自動保存されます。';
}
async function delPreset(name){try{await deletePreset(name)}catch(e){alert('削除できませんでした：'+e.message)}}
$('preset').onchange=()=>{if($('preset').value!=='')$('title').value=db.presets[Number($('preset').value)]};

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabpage').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='home')renderHome();if(b.dataset.tab==='tasks')renderTasks();if(b.dataset.tab==='week')renderWeek()});

$('eventForm').onsubmit=async e=>{
 e.preventDefault();let title=$('title').value.trim();if(!title)return;
 let base={date:$('date').value,start:$('start').value,end:$('end').value,title,income:+$('income').value||0,expense:+$('expense').value||0};
 let count=$('repeat').value==='weekly'?4:$('repeat').value==='monthly'?3:1;
 try{
   for(let i=0;i<count;i++){let ev={...base,date:$('repeat').value==='weekly'?addDays(base.date,i*7):$('repeat').value==='monthly'?addDays(base.date,i*30):base.date};let saved=await addEvent(ev);db.events.push({id:saved.id,...ev})}
   if(!db.presets.includes(title)){await addPreset(title);db.presets.push(title)}
   renderPresets();e.target.reset();$('date').value=iso(new Date());alert('予定をクラウドに保存しました！');renderHome();renderWeek();
 }catch(err){alert('保存できませんでした：'+err.message)}
};
$('clearForm').onclick=()=>$('eventForm').reset();

async function delEvent(id){try{await deleteEvent(id);alert('削除しました')}catch(e){alert('削除できませんでした：'+e.message)}}
function eventCard(e){return `<div class="card"><b>${esc(e.title)}</b> <span class="pill">${fmt(e.date)}</span><div>${time(e)}</div><div class="muted">給料：<span class="income">${money(e.income)}</span>　出費：<span class="expense">${money(e.expense)}</span></div><div class="actions"><button class="danger" onclick="delEvent('${e.id}')">削除</button></div></div>`}
function weekRange(start){return Array.from({length:7},(_,i)=>addDays(start,i))}
function renderHome(){
 let now=new Date(),monday=new Date(now);let day=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-day);let s=iso(monday),dates=weekRange(s);
 let ev=db.events.filter(e=>dates.includes(e.date)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 $('homeWeek').innerHTML=ev.length?ev.map(eventCard).join(''):'今週の予定はありません。';
 $('homeTasks').innerHTML=db.tasks.length?db.tasks.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(t=>`<div class="card"><b>${esc(t.title)}</b><div>提出：${fmt(t.due)} / 開始予定：${fmt(t.start)}</div></div>`).join(''):'課題はありません。';
}
$('taskForm').onsubmit=async e=>{
 e.preventDefault();let due=$('due').value,n=Math.max(1,+$('days').value||1),start=addDays(due,-n+1);let title=$('taskTitle').value.trim();
 try{let saved=await addTask({title,due,start});let t={id:saved.id,title,due,start};db.tasks.push(t);
 await addTaskEvent({date:start,start:'',end:'',title:'課題開始：'+title,income:0,expense:0});
 await addTaskEvent({date:due,start:'',end:'',title:'課題提出：'+title,income:0,expense:0});
 e.target.reset();$('days').value=3;renderTasks();renderHome();alert('課題をクラウドに保存し、開始日・提出日を予定に反映しました！');
 }catch(err){alert('保存できませんでした：'+err.message)}
};
function renderTasks(){$('tasksList').innerHTML=db.tasks.length?db.tasks.map(t=>`<div class="card"><b>${esc(t.title)}</b><div>開始：${fmt(t.start)}　提出：${fmt(t.due)}</div><button class="danger" onclick="delTask('${t.id}')">削除</button></div>`).join(''):'登録済み課題はありません。'}
async function delTask(id){try{await deleteTask(id);alert('削除しました')}catch(e){alert('削除できませんでした：'+e.message)}}
function searchEvents(){let d=$('qDate').value,t=$('qTime').value,x=$('qText').value.trim().toLowerCase();let a=db.events.filter(e=>(!d||e.date===d)&&(!t||e.start===t||e.end===t||time(e).includes(t))&&(!x||e.title.toLowerCase().includes(x))).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));$('results').innerHTML=a.length?a.map(eventCard).join(''):'該当する予定がありません。'}
$('doSearch').onclick=searchEvents;$('allSearch').onclick=()=>{$('qDate').value='';$('qTime').value='';$('qText').value='';searchEvents()};
function renderWeek(){let s=$('weekStart').value;if(!s){let d=new Date();let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);s=iso(d);$('weekStart').value=s}let ds=weekRange(s),names=['月','火','水','木','金','土','日'];$('weekCalendar').innerHTML='<div class="week">'+ds.map((d,i)=>`<div class="day"><h3>⭕️${names[i]}曜日<br>${fmt(d)}</h3>${db.events.filter(e=>e.date===d).sort((a,b)=>a.start.localeCompare(b.start)).map(e=>`<div class="event"><b>${esc(time(e))}</b><br>${esc(e.title)}</div>`).join('')}</div>`).join('')+'</div>';let lines=`📍${fmt(ds[0])}-${fmt(ds[6])}予定\n\n`;ds.forEach((d,i)=>{lines+=`⭕️${names[i]}曜日\n`;let a=db.events.filter(e=>e.date===d).sort((x,y)=>x.start.localeCompare(y.start));lines+=a.length?a.map(e=>`${time(e)} ${e.title}`).join('\n'):'予定なし';lines+='\n\n'});$('textWeek').innerHTML=`<textarea style="min-height:280px">${esc(lines.trim())}</textarea>`}
$('weekStart').onchange=renderWeek;

async function showApp(){ $('authView').classList.add('hidden');$('appView').classList.remove('hidden');try{await loadData()}catch(e){alert(e.message)}}
async function showAuth(){ $('appView').classList.add('hidden');$('authView').classList.remove('hidden')}

$('loginBtn').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('authMsg').textContent='メールアドレスとパスワードを入力してください。';return}$('authMsg').textContent='ログイン中…';const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){$('authMsg').textContent='ログインできません：'+error.message;return}await showApp()};
$('signupBtn').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(password.length<6){$('authMsg').textContent='パスワードは6文字以上にしてください。';return}const {error}=await supabaseClient.auth.signUp({email,password});$('authMsg').textContent=error?('登録できません：'+error.message):'登録しました。メール確認が必要な場合は確認後にログインしてください。'};
$('syncBtn').onclick=async()=>{try{await loadData();alert('クラウドから最新データを読み込みました。')}catch(e){alert('同期できませんでした：'+e.message)}};
$('logoutBtn').onclick=async()=>{await supabaseClient.auth.signOut();await showAuth()};
supabaseClient.auth.onAuthStateChange((event,session)=>{setTimeout(()=>session?showApp():showAuth(),0)});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
$('date').value=iso(new Date());
</script>
</body></html>
